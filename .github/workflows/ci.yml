name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # Frontend, script, contract, and pure-domain tests
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run lint:openapi
      - run: npm run validate:feature004-contract
      - run: npm run build # Static production build; no network required
      - run: npm run validate:production-artifact
      - run: npm run size
      - run: npm run snapshot:generate
